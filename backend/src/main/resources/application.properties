# ==========================================================
# Spring Boot Application Properties (Local Configuration)
# ==========================================================

spring.application.name=student-auth-backend

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration (256-bit secret key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000



# Authorized Administrator Configuration
app.admin.email=admin@example.com
app.admin.password=Admin@Secure2026!
app.admin.name=System Administrator



# CORS Configuration (permits React dev server on ports 5173 and 5174)
app.cors.allowed-origins=https://student-management-1-18gn.onrender.com/
